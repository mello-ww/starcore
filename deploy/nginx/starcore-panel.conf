# /etc/nginx/sites-available/starcore - Mission Control behind HTTPS on starcore-panel.duckdns.org.
#
# The lines marked "managed by Certbot" are exactly what Certbot wrote on the server; keep them
# as they are so renewals keep working. StarCore itself only ever listens on 127.0.0.1:8090
# (engine/config.toml), so this proxy is its only way in from outside.
server {

    server_name starcore-panel.duckdns.org;

    # Files and Locked Folder accept uploads up to 2 GB; they are streamed straight through
    client_max_body_size 2g;

    # the one-shot CLI bridge is for commands typed on this machine only (it also needs a
    # per-run token) - nothing outside ever needs to reach it. A regex location wins over
    # "location /", and it is matched against nginx's normalized URI (percent-decoded,
    # "//" merged, "./" and "../" resolved), so /api//cli/run, /api/%63li/run,
    # /API/CLI/run, /api/cli/run/ and anything else under /api/cli are all refused here,
    # whatever cookie or token comes with them
    location ~* ^/api/+cli(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # music and video streams, Music's 30-second long-poll and (later) streamed AI
        # replies must reach the client as they are produced, not once a buffer fills
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # StarCore sees plain HTTP from this proxy, so it can't mark its session cookie
        # Secure itself; nginx 1.18 has no proxy_cookie_flags, this appends it instead
        proxy_cookie_path / "/; Secure";
    }

    add_header Strict-Transport-Security "max-age=31536000" always;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/starcore-panel.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/starcore-panel.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = starcore-panel.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name starcore-panel.duckdns.org;
    return 404; # managed by Certbot


}
