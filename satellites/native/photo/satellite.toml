name = "Photo"
version = "1.0.0"
author = "mellow"
description = "Local photo library satellite."
# its own icon, one of [icons] below (icons/<name>.svg)
icon = "logo"
# from the shared icon set every client can draw (contracts/ui/vocabulary.json)
icon_name = "camera"

# its own icons, icons/<name>.svg, each with the shared icon drawn if its file is refused
[icons]
logo = "camera"
albums = "folder"

# what any interface can pick from through the client's media picker (the pick action in
# docs/reference/ui-contract.md): the active library only - never the recycle bin or the Locked Folder
[provides."media.gallery"]
version = 1
operations = { list = "media", thumbnail = "thumbnails", resolve = "media/resolve", original = "media/original", release = "media/release", adopt = "media/adopt" }

# a device's one-way backup into the library (backup.py): a device credential limited to it
# reaches only these routes
[provides."media.sync"]
version = 1
operations = { status = "backup/status", check = "backup/check", upload = "backup/upload", devices = "backup/devices" }

# the files it opens by their path, from another interface's "Opens with" (opening.py): a path is
# only ever read through whichever Satellite provides files.browse, with the user's session
[provides."files.open"]
version = 1
operations = { open = "open" }
types = ["image", "video"]
extensions = [".jpg", ".jpeg", ".png", ".webp", ".mp4", ".mov", ".3gp"]
label = "Photos"
