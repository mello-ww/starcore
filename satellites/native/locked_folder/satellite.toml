name = "LockedFolder"
version = "1.0.0"
author = "mellow"
description = "A PIN-protected private area for photos and files, opened from Photos."
# its own icon, one of [icons] below (icons/<name>.svg)
icon = "logo"
# from the shared icon set every client can draw (contracts/ui/vocabulary.json)
icon_name = "lock"
section_of = "Photo" # opened as a tab of Photo, not from its own navigation entry

# its own icons, icons/<name>.svg, each with the shared icon drawn if its file is refused
[icons]
logo = "lock"

# a protected store media can be moved into from a shared interface (the secure action) -
# deliberately no operation that lists or reads the vault: only its own document's routes do,
# behind its own unlock.
# sealed (server-side only) tells a library whether a file was moved in, so it stays out
[provides."media.vault"]
version = 1
operations = { status = "status", unlock = "unlock", lock = "lock", keep = "keep", move_in = "move_in", biometric = "biometric", sealed = "sealed" }

# what the Engine asks before any Satellite serves, lists, indexes, renames or deletes a path:
# whether it is in the vault (or contains it), and whether this session may reach it now
[provides."files.protected"]
version = 1
operations = { check = "check" }
