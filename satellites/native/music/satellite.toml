name = "Music"
version = "1.0.0"
author = "mellow"
description = "Local music library satellite."
icon = "icon.svg"
# from the shared icon set every client can draw (contracts/ui/vocabulary.json)
icon_name = "music"

# a Satellite capability: any client or Satellite can search and play this
# library's tracks through it without naming Music (docs/media-audio.md).
# Each operation is one of Music's existing routes.
[provides."audio.library"]
version = 1
operations = { search = "search", track = "tracks", resolve = "playback", artwork = "artwork", lyrics = "lyrics" }

# the playback session beside the library: the saved queue, play history, radio, listener
# preferences, likes, the stream route and StarCore Connect. Not in the shared vocabulary yet
# (registered as declared); the shared audio player uses each operation only when the
# audio.library provider declares it too.
[provides."audio.session"]
version = 1
operations = { queue = "queue", history = "history", radio = "radio", preferences = "preferences", favorites = "favorites", stream = "stream", connect = "connect" }
